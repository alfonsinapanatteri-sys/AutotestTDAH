<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Te pasa? Autotest TDAH</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap">
<style>
:root{
  --bg:#fdfbf7; --surface:#ffffff; --ink:#1e3a8a; --ink-deep:#172554; --ink-soft:#3b4a7a;
  --accent:#f97316; --accent-text:#c2410c; --accent-wash:#fff1e6; --line:#d9dcea; --ok:#166534;
  color-scheme:light;
}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:19px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:'Fraunces',Georgia,'Times New Roman',serif;color:var(--ink-deep);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:760px;margin:0 auto}
header.top{background:var(--surface);border-bottom:4px solid var(--accent);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
header.top img{height:64px;width:auto;max-width:100%;display:block}
.sep{width:1px;align-self:stretch;background:var(--line)}
main{padding-block:32px 40px;outline:none}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:24px}
.warn{background:var(--accent-wash);border:2px solid var(--accent);border-radius:18px;padding:20px 22px;display:flex;gap:16px;align-items:flex-start;color:var(--ink-deep)}
.warn svg{flex:none;margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 28px;border-radius:14px;font:700 21px/1.2 'Atkinson Hyperlegible',system-ui,sans-serif;cursor:pointer;border:3px solid var(--ink-deep);background:var(--accent);color:var(--ink-deep)}
.btn:hover{filter:brightness(.95)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{min-height:44px;font-size:17px;padding:8px 16px}
:focus-visible{outline:4px solid var(--ink-deep);outline-offset:3px;border-radius:6px}
.progress{height:14px;background:#e5e8f4;border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);transition:width .25s ease}
.eyebrow{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px;color:var(--accent-text)}
.opt{display:block;position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 18px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-weight:700;font-size:21px;color:var(--ink)}
.opt span::before{content:"";flex:none;width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);background:var(--surface)}
.opt input:checked+span{border-color:var(--ink-deep);background:var(--accent-wash);box-shadow:inset 0 0 0 2px var(--accent)}
.opt input:checked+span::before{background:radial-gradient(circle,var(--accent) 0 45%,var(--surface) 50%);border-color:var(--ink-deep)}
.opt input:focus-visible+span{outline:4px solid var(--ink-deep);outline-offset:3px}
.score{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:76px;line-height:1;color:var(--ink-deep)}
.score small{font-size:36px;color:var(--accent-text)}
.tip,.step{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:16px 18px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;font-size:19px;cursor:pointer;min-height:56px}
.tip .mark,.step .mark{flex:none;width:28px;height:28px;border:3px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-weight:700;color:var(--ink-deep);background:var(--surface)}
.tip[aria-pressed=true],.step[aria-pressed=true]{background:var(--accent-wash);border-color:var(--accent)}
.tip[aria-pressed=true] .mark,.step[aria-pressed=true] .mark{background:var(--accent);border-color:var(--ink-deep)}
.tiplist{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.tipli{display:flex;gap:14px;align-items:flex-start;padding:14px 4px;border-top:1px solid var(--line)}
.tipli:last-child{border-bottom:1px solid var(--line)}
.tipli .em{font-size:28px;line-height:1.2;flex:none}
.hit{color:var(--accent-text);font-weight:700}
footer.pia{background:var(--ink-deep);color:#fff;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
footer.pia h2{color:#fff;font-size:32px}
footer.pia a{color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:4px}
footer.pia .btn{background:#fff;color:var(--ink-deep);border-color:#fff;text-decoration:none}
footer.pia .note{font-size:15px;color:#d6dcf5;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.progress>div{transition:none}}
@media (max-width:520px){body{font-size:18px}header.top img{height:52px}.score{font-size:64px}}
</style>

</head>

<script>
(function(){
var OPTS=['Nunca','Rara vez','A veces','A menudo','Muy a menudo'];
var Q=[
 {t:'Una vez hecha la parte difícil de un trabajo, me cuesta terminar los detalles finales.',min:2},
 {t:'Cuando una tarea requiere organización, me cuesta poner las cosas en orden.',min:2},
 {t:'Me olvido de citas, fechas de entrega u obligaciones.',min:2},
 {t:'Si una tarea exige pensar mucho, la evito o la postergo.',min:3},
 {t:'Cuando tengo que estar sentado/a mucho tiempo, muevo las manos o los pies, o me retuerzo en la silla.',min:3},
 {t:'Me siento demasiado activo/a, como si me impulsara un motor.',min:3}
];
var TIPS=[['⏰','Dos alarmas por entrega: una semana y dos días antes.'],['⏱️','Temporizador de 15 minutos para arrancar.'],['📑','Una lista de solo 3 tareas por día.'],['🎧','Auriculares o ruido blanco para estudiar.']];
var STEPS=['Escribirle al PIA por WhatsApp o Instagram','Pedir turno con un profesional de la salud','Llevar este test completo a la consulta','Contarle a una persona de confianza'];
var A=[null,null,null,null,null,null], cur=0, view='welcome', tipsOn=[0,0,0,0], stepsOn=[0,0,0,0];
var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function score(){var n=0;A.forEach(function(a,i){if(a!==null&&a>=Q[i].min)n++});return n}
function focusMain(){app.focus({preventScroll:true});window.scrollTo(0,0)}

function welcome(){
 app.innerHTML=
 '<div class="flex flex-col gap-6">'+
 '<div><p class="eyebrow">PIA-UPC · Autotest</p><h1 style="font-size:clamp(52px,12vw,88px);margin-top:6px">¿Te pasa?</h1>'+
 '<p style="font-size:26px;font-weight:700;margin:14px 0 6px;color:var(--ink)">Autotest de TDAH para estudiantes universitarios</p>'+
 '<p style="margin:0;color:var(--ink-soft);font-size:17px">Parte A basada en la escala de autorreporte ASRS v1.1 de la Organización Mundial de la Salud. Adaptada a la vida en la facultad.</p></div>'+
 '<div class="warn" role="note"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#172554" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".6" fill="#172554"/></svg>'+
 '<p style="margin:0"><strong>Esto no es un diagnóstico.</strong> Es una herramienta de detección que ayuda a reconocer señales y a decidir si conviene consultar. Solo un profesional de la salud puede diagnosticar TDAH. Tus respuestas son privadas: no hace falta entregarlas a nadie.</p></div>'+
 '<div><button class="btn" id="start" type="button">Comenzar Autotest <span aria-hidden="true">→</span></button></div></div>';
 document.getElementById('start').onclick=function(){view='q';cur=0;render()};
}

function question(){
 var q=Q[cur],pct=Math.round(cur/Q.length*100);
 var opts=OPTS.map(function(o,i){return '<label class="opt"><input type="radio" name="q'+cur+'" value="'+i+'"'+(A[cur]===i?' checked':'')+'><span>'+o+'</span></label>'}).join('');
 app.innerHTML=
 '<div class="flex flex-col gap-6">'+
 '<div><div class="flex justify-between" style="font-weight:700;margin-bottom:8px"><span>Pregunta '+(cur+1)+' de '+Q.length+'</span><span>'+pct+'%</span></div>'+
 '<div class="progress" role="progressbar" aria-label="Progreso del autotest" aria-valuemin="0" aria-valuemax="'+Q.length+'" aria-valuenow="'+cur+'"><div style="width:'+pct+'%"></div></div></div>'+
 '<fieldset class="card" style="margin:0"><legend class="eyebrow" style="padding:0 8px;margin-left:-8px">En los últimos 6 meses… ¿con qué frecuencia te pasa?</legend>'+
 '<h2 id="qt" style="font-size:clamp(26px,5.5vw,34px);margin:6px 0 20px" tabindex="-1">'+esc(q.t)+'</h2>'+
 '<div class="flex flex-col gap-3" role="radiogroup" aria-labelledby="qt">'+opts+'</div></fieldset>'+
 '<div class="flex flex-wrap justify-between gap-3"><button class="btn ghost" id="prev" type="button"'+(cur===0?' disabled':'')+'><span aria-hidden="true">←</span> Anterior</button>'+
 '<button class="btn" id="next" type="button"'+(A[cur]===null?' disabled':'')+'>'+(cur===Q.length-1?'Ver resultados':'Siguiente')+' <span aria-hidden="true">→</span></button></div></div>';
 app.querySelectorAll('input[type=radio]').forEach(function(r){r.onchange=function(){A[cur]=+r.value;document.getElementById('next').disabled=false}});
 document.getElementById('prev').onclick=function(){if(cur>0){cur--;render()}};
 document.getElementById('next').onclick=function(){if(A[cur]===null)return;if(cur<Q.length-1){cur++}else{view='res'}render()};
}

function results(){
 var s=score(),hi=s>=4;
 var title=hi?'4 a 6 - Tus respuestas coinciden con patrones frecuentes en adultos con TDAH.':'0 a 3 - Tus respuestas no muestran ese patrón.';
 var text=hi?'Te recomendamos una consulta con un profesional de la salud (neurología, psiquiatría o psicología) y contactar al PIA para pensar apoyos en la cursada.':'Si igual algo te cuesta, consultá. Las dificultades son reales aunque el test no las señale, y el PIA acompaña sin diagnóstico.';
 var rows=Q.map(function(q,i){var hit=A[i]>=q.min;return '<li style="padding:12px 0;border-top:1px solid var(--line)"><div style="font-weight:700">'+(i+1)+'. '+esc(q.t)+'</div><div>Tu respuesta: <strong>'+OPTS[A[i]]+'</strong> '+(hit?'<span class="hit">· coincide con el patrón</span>':'<span style="color:var(--ink-soft)">· no suma</span>')+'</div></li>'}).join('');
 var tips=TIPS.map(function(t){return '<li class="tipli"><span class="em" aria-hidden="true">'+t[0]+'</span><span>'+t[1]+'</span></li>'}).join('');
 var steps=STEPS.map(function(t,i){return '<button class="step" type="button" role="checkbox" aria-checked="'+(stepsOn[i]?'true':'false')+'" aria-pressed="'+(stepsOn[i]?'true':'false')+'" data-step="'+i+'"><span class="mark" aria-hidden="true">'+(stepsOn[i]?'✓':'')+'</span><span>'+t+'</span></button>'}).join('');
 app.innerHTML=
 '<div class="flex flex-col gap-8">'+
 '<section class="card" aria-labelledby="rt"><p class="eyebrow">Tu resultado</p>'+
 '<div class="score" aria-label="Puntaje: '+s+' de 6">'+s+'<small>/6</small></div>'+
 '<h2 id="rt" style="font-size:clamp(24px,5vw,30px);margin:14px 0 10px" tabindex="-1">'+title+'</h2><p style="margin:0">'+text+'</p>'+
 '<details style="margin-top:18px"><summary style="cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center">Ver mis respuestas</summary><ol style="list-style:none;margin:0;padding:0">'+rows+'</ol></details></section>'+
 '<section aria-labelledby="h1x"><h2 id="h1x" style="font-size:28px;margin-bottom:6px">PARA PROBAR DESDE HOY</h2><ul class="tiplist">'+tips+'</ul></section>'+
 '<section aria-labelledby="h2x"><h2 id="h2x" style="font-size:28px;margin-bottom:14px">MIS PRÓXIMOS PASOS</h2><div class="flex flex-col gap-3" role="group" aria-labelledby="h2x">'+steps+'</div></section>'+
 '<section class="card" style="background:var(--accent-wash);border-color:var(--accent)"><button class="btn" id="pdf" type="button"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#172554" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg> Descargar Resultados en PDF</button>'+
 '<p id="pdfMsg" role="status" style="margin:14px 0 0;font-size:17px"></p><div id="pdfFallback"></div></section>'+
 '<div><button class="btn ghost" id="again" type="button">Repetir el autotest</button></div></div>';
 app.querySelectorAll('[data-step]').forEach(function(b){b.onclick=function(){var i=+b.dataset.step;stepsOn[i]=stepsOn[i]?0:1;b.setAttribute('aria-checked',stepsOn[i]?'true':'false');b.setAttribute('aria-pressed',stepsOn[i]?'true':'false');b.querySelector('.mark').textContent=stepsOn[i]?'✓':''}});
 document.getElementById('pdf').onclick=makePdf;
 document.getElementById('again').onclick=function(){A=[null,null,null,null,null,null];cur=0;tipsOn=[0,0,0,0];stepsOn=[0,0,0,0];view='welcome';render()};
}

function summaryText(){
 var s=score(),hi=s>=4;
 var l=['¿Te pasa? Autotest de TDAH - PIA-UPC','Puntaje: '+s+'/6',hi?'Tus respuestas coinciden con patrones frecuentes en adultos con TDAH. Te recomendamos una consulta con un profesional de la salud y contactar al PIA.':'Tus respuestas no muestran ese patrón. Si igual algo te cuesta, consultá.',''];
 Q.forEach(function(q,i){l.push((i+1)+'. '+q.t+' -> '+OPTS[A[i]]+(A[i]>=q.min?' (coincide)':''))});
 l.push('','Para probar desde hoy:');TIPS.forEach(function(t){l.push('- '+t[1])});
 l.push('','PIA-UPC: WhatsApp +54 9 351 872 2694 · Instagram @accesibilidadupc');return l.join('\n');
}

async function makePdf(){
 var msg=document.getElementById('pdfMsg'),fb=document.getElementById('pdfFallback');
 try{
  if(!window.jspdf)throw new Error('lib');
  var d=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,M=18,y=0,s=score(),hi=s>=4;
  var navy=[23,37,84],orange=[249,115,22];
  function need(h){if(y+h>282){d.addPage();y=20}}
